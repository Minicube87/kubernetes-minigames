apiVersion: apps/v1
kind: Deployment
metadata:
  name: soccer-rt
spec:
  replicas: 0 # Pi 3 (1 GB RAM) reicht nicht - siehe JOURNEY.MD
  selector:
    matchLabels:
      app: soccer-rt
  template:
    metadata:
      labels:
        app: soccer-rt
    spec:
      containers:
        - name: rt
          image: node:18-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "48Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
              cpu: "250m"
          volumeMounts:
            - name: rt-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: rt-code
          configMap:
            name: soccer-rt-code
