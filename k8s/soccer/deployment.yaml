apiVersion: apps/v1
kind: Deployment
metadata:
  name: soccer
spec:
  replicas: 0 # Pi 3 (1 GB RAM) reicht nicht - siehe JOURNEY.MD
  selector:
    matchLabels:
      app: soccer
  template:
    metadata:
      labels:
        app: soccer
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site-content
          configMap:
            name: soccer-content
